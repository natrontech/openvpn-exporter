version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" only covers .github/workflows; composite actions must be listed explicitly
    directories:
      - "/"
      - "/.github/actions/publish-image"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ":seedling:"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ":robot:"
    labels:
      - "dependencies"
      - "go"
    open-pull-requests-limit: 10

  # No "docker" ecosystem: images are built with ko (no Dockerfile), and the
  # updater fails hard when it finds no Dockerfile/Kubernetes YAML.
  # The ko base image in .ko.yaml is digest-pinned and refreshed manually.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Zurich"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ":robot:"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
